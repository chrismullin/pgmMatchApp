<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liga de los equipos del Martinenc</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-liga">
<div class="page">
  <header>
    <h1>Liga de los equipos del Martinenc</h1>
    <p class="subtitle">Resultados y calendario de liga del Cadet S16 "A" y los Juvenils "A", "B", "C" y "D", agrupados por fin de semana.</p>
    <nav class="links">
      <a href="index.html">⬅️ Volver a los amistosos del Martinenc</a>
      <a href="rivales.html">📊 Resultados y estadísticas de los rivales</a>
    </nav>
    <div class="filter-row">
      <label for="equipo-select">Equipo:</label>
      <select id="equipo-select">
        <option value="">Todos los equipos</option>
      </select>
    </div>
  </header>

  <div id="status">Cargando datos…</div>

  <div class="pager">
    <button id="prev-btn" type="button">‹ Anterior</button>
    <span id="pager-label" class="pager-label"></span>
    <button id="next-btn" type="button">Siguiente ›</button>
  </div>

  <div id="results"></div>

  <footer>Datos: Federació Catalana de Futbol (fcf.cat)</footer>
</div>

<script src="js/common.js"></script>
<script>
// Los datos se descargan y filtran periódicamente por un GitHub Action
// (ver .github/workflows/update-resultados-martinenc.yml) porque la API de
// fcf.cat no envía cabeceras CORS y bloquea el fetch directo desde GitHub
// Pages.
const DATA_URL = 'data/resultados_martinenc.json';
// Equipo a resaltar en azul claro, igual que en rivales.html: el Martinenc S16 "A".
const OWN_CODE = '54304670';

const resultsEl = document.getElementById('results');
const equipoSelect = document.getElementById('equipo-select');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const pagerLabel = document.getElementById('pager-label');

let DATA = null;
// Fines de semana ordenados cronológicamente: cada elemento es el lunes
// (fecha ISO) de la semana que agrupa esos partidos.
let weekends = [];
let currentIndex = 0;

function formatHoraComienzo(comienzo) {
  if (!comienzo) return '';
  const partes = comienzo.split(' ');
  return partes[1] ? partes[1].slice(0, 5) : '';
}

// COMIENZO1 llega como "YYYY-MM-DD HH:MM:SS" en hora local (Europe/Madrid);
// se interpreta tal cual, sin conversión de zona horaria, para no desplazar
// el día del partido.
function parseComienzo(comienzo) {
  if (!comienzo) return null;
  const d = new Date(comienzo.replace(' ', 'T'));
  return isNaN(d) ? null : d;
}

// Formatea una fecha como YYYY-MM-DD usando sus componentes LOCALES (no
// toISOString, que convierte a UTC y puede desplazar el día en zonas con
// offset positivo como Europe/Madrid, p.ej. medianoche local del 14/12 pasa
// a ser las 23:00 UTC del 13/12).
function toLocalISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Clave de fin de semana: el lunes de la semana que contiene la fecha del
// partido, para agrupar sábado+domingo (y cualquier aplazamiento dentro de
// esa misma semana) en una sola página.
function weekendKey(d) {
  const dia = (d.getDay() + 6) % 7; // 0=lunes ... 6=domingo
  const monday = new Date(d);
  monday.setDate(d.getDate() - dia);
  monday.setHours(0, 0, 0, 0);
  return toLocalISODate(monday);
}

// ESTADO '3' es un partido suspendido (SUSPES en la FCF): llega sin goles, y a
// veces con CERRADA '1', por lo que no debe contarse como disputado.
function isSuspendido(m) {
  return m.ESTADO === '3';
}

// A diferencia de otros.json/amistosos.json, aquí la API de liga informa de
// forma fiable si el partido se ha jugado (ESTADO/CERRADA), sin necesidad de
// heurísticos basados en la hora.
function isJugadoLiga(m) {
  if (isSuspendido(m)) return false;
  if (m.ESTADO === '1' || m.CERRADA === '1') return true;
  return m.GOLES_CASA != null && m.GOLES_FUERA != null;
}

// Convierte "GRUP 2" en "G2" para mostrarlo junto al nombre de la categoría
// (p.ej. "JUVENIL SEGONA DIVISIÓ (G8)").
function formatCategoria(nombreCompeticion, grupo) {
  const nombre = nombreCompeticion ?? '';
  const g = grupo ? grupo.replace(/^GRUP\s*/i, 'G') : '';
  return g ? `${nombre} (${g})` : nombre;
}

function buildMatchCard(m) {
  const jugado = isJugadoLiga(m);
  const esPropio = (m.trackedTeams || []).includes(OWN_CODE);
  const centro = isSuspendido(m)
    ? `<span class="badge-suspended">Suspendido</span>`
    : matchCenterHtml(jugado, m.CODACTA, m.GOLES_CASA, m.GOLES_FUERA);
  const casaUrl = equipoUrl(m.CODCLUB_CASA, m.CODEQUIPO_CASA);
  const fueraUrl = equipoUrl(m.CODCLUB_FUERA, m.CODEQUIPO_FUERA);
  const mapsUrl = (m.LATITUD && m.LONGITUD)
    ? mapsSearchUrl(m.LATITUD + ',' + m.LONGITUD)
    : (m.CAMPO ? mapsSearchUrl(m.CAMPO) : null);

  const card = document.createElement('article');
  card.className = 'match-card' + (esPropio ? ' own' : '');
  card.innerHTML = `
    <div class="match-teams">
      <div class="team">
        ${crestHtml(m.ESCUDO_CASA, casaUrl)}
        <span class="team-name">${m.NOMBRE_CASA ?? ''}</span>
      </div>
      <div class="center-info">
        <span class="match-hora">${formatHoraComienzo(m.COMIENZO1)}</span>
        ${centro}
      </div>
      <div class="team">
        ${crestHtml(m.ESCUDO_FUERA, fueraUrl)}
        <span class="team-name">${m.NOMBRE_FUERA ?? ''}</span>
      </div>
    </div>
    <div class="match-meta">
      <span>📍 ${mapsUrl ? `<a href="${mapsUrl}" target="_blank" rel="noopener">${m.CAMPO}</a>` : 'Campo por confirmar'}</span>
      <span>🏷️ ${formatCategoria(m.NOMBRE_COMPETICION, m.GRUPO)}</span>
      <span class="badge-jornada">Jornada ${m.JORNADA}</span>
    </div>
  `;
  return card;
}

function matchesFiltrados() {
  const filtroEquipo = equipoSelect.value;
  return (DATA.matches || []).filter(m => !filtroEquipo || (m.trackedTeams || []).includes(filtroEquipo));
}

// Recalcula la lista de fines de semana disponibles a partir de los
// partidos ya filtrados por equipo, intentando mantener la posición sobre
// el mismo fin de semana si sigue existiendo tras cambiar el filtro.
function recalcWeekends() {
  const keyActual = weekends[currentIndex];
  const claves = new Set();
  for (const m of matchesFiltrados()) {
    const d = parseComienzo(m.COMIENZO1);
    if (d) claves.add(weekendKey(d));
  }
  weekends = [...claves].sort();
  if (weekends.length === 0) {
    currentIndex = 0;
    return;
  }
  const idx = weekends.indexOf(keyActual);
  currentIndex = idx >= 0 ? idx : weekends.length - 1;
}

function render() {
  recalcWeekends();
  resultsEl.innerHTML = '';

  if (weekends.length === 0) {
    pagerLabel.textContent = '';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    resultsEl.innerHTML = '<p>No hay partidos para ese filtro.</p>';
    return;
  }

  prevBtn.disabled = currentIndex <= 0;
  nextBtn.disabled = currentIndex >= weekends.length - 1;

  const claveSemana = weekends[currentIndex];
  const matches = matchesFiltrados()
    .filter(m => {
      const d = parseComienzo(m.COMIENZO1);
      return d && weekendKey(d) === claveSemana;
    })
    .sort((a, b) => (a.COMIENZO1 || '').localeCompare(b.COMIENZO1 || ''));

  const monday = new Date(claveSemana + 'T00:00:00');
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  pagerLabel.textContent = `${monday.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' })} – ${sunday.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' })}`;

  const groups = new Map();
  for (const m of matches) {
    const d = parseComienzo(m.COMIENZO1);
    const key = d ? toLocalISODate(d) : '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }

  for (const [, groupMatches] of groups) {
    const wrap = document.createElement('div');
    wrap.className = 'date-group';
    const heading = document.createElement('h2');
    heading.className = 'date-heading';
    heading.textContent = formatFecha(parseComienzo(groupMatches[0].COMIENZO1));
    wrap.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'matches-list';
    for (const m of groupMatches) list.appendChild(buildMatchCard(m));
    wrap.appendChild(list);

    resultsEl.appendChild(wrap);
  }
}

prevBtn.addEventListener('click', () => {
  if (currentIndex > 0) { currentIndex--; render(); }
});
nextBtn.addEventListener('click', () => {
  if (currentIndex < weekends.length - 1) { currentIndex++; render(); }
});
equipoSelect.addEventListener('change', render);

fetchJson(DATA_URL)
  .then(data => {
    DATA = data;
    const equipos = [...(data.equipos || [])].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    for (const eq of equipos) {
      const opt = document.createElement('option');
      opt.value = eq.codigo;
      opt.textContent = eq.nombre;
      equipoSelect.appendChild(opt);
    }

    // Posiciona por defecto en el fin de semana más próximo a hoy (el
    // anterior o en curso, para no empezar siempre al final del todo).
    recalcWeekends();
    const hoyKey = weekendKey(new Date());
    const idxHoy = weekends.findIndex(k => k >= hoyKey);
    currentIndex = idxHoy >= 0 ? idxHoy : Math.max(0, weekends.length - 1);

    statusEl.textContent = `${(data.matches || []).length} partido(s) de ${(data.equipos || []).length} equipo(s). Actualizado: ${formatActualizado(data.updatedAt)}`;

    render();
  })
  .catch(err => {
    setError(`No se pudo cargar ${DATA_URL}: ${err.message}`);
    console.error(err);
  });
</script>
</body>
</html>
