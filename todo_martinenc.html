<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liga de los equipos del Martinenc</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card-bg: #ffffff;
    --navy: #10203f;
    --navy-soft: #47547a;
    --red: #c81e2c;
    --border: #e4e7ec;
    --pending-bg: #fef6e7;
    --pending-text: #a15c00;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--navy);
    margin: 0;
    padding: 0 1rem 3rem;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    padding: 2rem 0 1.5rem;
  }

  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.01em;
    margin: 0 0 0.25rem;
    color: var(--navy);
  }

  .subtitle {
    color: var(--navy-soft);
    margin: 0 0 1.25rem;
    font-size: 0.95rem;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 1.25rem;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--navy);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .links a:hover {
    border-color: var(--red);
    color: var(--red);
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .filter-row label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--navy-soft);
  }

  .filter-row select {
    font: inherit;
    padding: 0.45rem 0.7rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--navy);
    min-width: 220px;
  }

  #status {
    color: var(--navy-soft);
    font-size: 0.85rem;
    margin: 0 0 1rem;
    white-space: pre-wrap;
  }

  #status.error {
    color: var(--red);
    font-weight: 600;
  }

  .pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin-bottom: 1.25rem;
  }

  .pager button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--navy);
    border-radius: 999px;
    padding: 0.5rem 1rem;
    font: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .pager button:hover:not(:disabled) {
    border-color: var(--red);
    color: var(--red);
  }

  .pager button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .pager-label {
    flex: 1;
    text-align: center;
    font-weight: 700;
    font-size: 0.95rem;
    text-transform: capitalize;
  }

  .date-group {
    margin-bottom: 1.5rem;
  }

  .date-heading {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
    text-transform: capitalize;
    margin: 0 0 0.8rem;
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    background: var(--navy);
  }

  .matches-list {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .match-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    padding: 1.1rem 1.2rem 0.9rem;
  }

  .match-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.75rem;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    text-align: center;
    min-width: 0;
  }

  .team a { line-height: 0; }

  .team img {
    width: 48px;
    height: 48px;
    object-fit: contain;
  }

  .team-name {
    font-weight: 700;
    font-size: 0.85rem;
    line-height: 1.15;
  }

  .center-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    min-width: 92px;
  }

  .match-hora {
    font-size: 0.75rem;
    color: var(--navy-soft);
    font-weight: 600;
  }

  .match-score {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--red);
  }

  a.match-score { text-decoration: none; }
  a.match-score:hover { text-decoration: underline; }

  .badge-pending {
    display: inline-block;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    background: var(--pending-bg);
    color: var(--pending-text);
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .badge-jornada {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    background: var(--bg);
    color: var(--navy-soft);
    font-size: 0.7rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .match-meta {
    margin-top: 0.9rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 1.2rem;
    font-size: 0.78rem;
    color: var(--navy-soft);
  }

  .match-meta span {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .match-meta a {
    color: var(--navy-soft);
    text-decoration: underline;
    text-decoration-color: var(--border);
  }

  .match-meta a:hover {
    color: var(--red);
    text-decoration-color: var(--red);
  }

  footer {
    margin-top: 1.5rem;
    color: var(--navy-soft);
    font-size: 0.78rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Liga de los equipos del Martinenc</h1>
    <p class="subtitle">Resultados y calendario de liga del Cadet S16 "A" y los Juvenils "A", "B", "C" y "D", agrupados por fin de semana.</p>
    <nav class="links">
      <a href="index.html">⬅️ Volver a los amistosos del Martinenc</a>
      <a href="rivales.html">📊 Resultados y estadísticas de los rivales</a>
    </nav>
    <div class="filter-row">
      <label for="equipo-select">Equipo:</label>
      <select id="equipo-select">
        <option value="">Todos los equipos</option>
      </select>
    </div>
  </header>

  <div id="status">Cargando datos…</div>

  <div class="pager">
    <button id="prev-btn" type="button">‹ Anterior</button>
    <span id="pager-label" class="pager-label"></span>
    <button id="next-btn" type="button">Siguiente ›</button>
  </div>

  <div id="results"></div>

  <footer>Datos: Federació Catalana de Futbol (fcf.cat)</footer>
</div>

<script>
// Los datos se descargan y filtran periódicamente por un GitHub Action
// (ver .github/workflows/update-resultados-martinenc.yml) porque la API de
// fcf.cat no envía cabeceras CORS y bloquea el fetch directo desde GitHub
// Pages.
const DATA_URL = 'data/resultados_martinenc.json';
const CREST_BASE = 'https://files.fcf.cat/escudos/clubes/escudos/';

const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const equipoSelect = document.getElementById('equipo-select');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const pagerLabel = document.getElementById('pager-label');

let DATA = null;
// Fines de semana ordenados cronológicamente: cada elemento es el lunes
// (fecha ISO) de la semana que agrupa esos partidos.
let weekends = [];
let currentIndex = 0;

function setError(message) {
  statusEl.textContent = message;
  statusEl.classList.add('error');
}

function crestUrl(filename) {
  return filename ? CREST_BASE + encodeURIComponent(filename) : '';
}

function formatHora(comienzo) {
  if (!comienzo) return '';
  const partes = comienzo.split(' ');
  return partes[1] ? partes[1].slice(0, 5) : '';
}

// COMIENZO1 llega como "YYYY-MM-DD HH:MM:SS" en hora local (Europe/Madrid);
// se interpreta tal cual, sin conversión de zona horaria, para no desplazar
// el día del partido.
function parseComienzo(comienzo) {
  if (!comienzo) return null;
  const d = new Date(comienzo.replace(' ', 'T'));
  return isNaN(d) ? null : d;
}

function formatFecha(d) {
  if (!d) return '';
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
}

// Clave de fin de semana: el lunes (ISO) de la semana que contiene la fecha
// del partido, para agrupar sábado+domingo (y cualquier aplazamiento dentro
// de esa misma semana) en una sola página.
function weekendKey(d) {
  const dia = (d.getDay() + 6) % 7; // 0=lunes ... 6=domingo
  const monday = new Date(d);
  monday.setDate(d.getDate() - dia);
  monday.setHours(0, 0, 0, 0);
  return monday.toISOString().slice(0, 10);
}

function formatActualizado(iso) {
  if (!iso) return '?';
  const fecha = new Date(iso);
  if (isNaN(fecha)) return iso;
  const partes = new Intl.DateTimeFormat('es-ES', {
    timeZone: 'Europe/Madrid',
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(fecha);
  const valor = tipo => partes.find(p => p.type === tipo)?.value;
  return `${valor('day')}/${valor('month')}/${valor('year')} a las ${valor('hour')}:${valor('minute')}`;
}

// A diferencia de otros.json/amistosos.json, aquí la API de liga informa de
// forma fiable si el partido se ha jugado (ESTADO/CERRADA), sin necesidad de
// heurísticos basados en la hora.
function isJugado(m) {
  if (m.ESTADO === '1' || m.CERRADA === '1') return true;
  return m.GOLES_CASA != null && m.GOLES_FUERA != null;
}

function buildMatchCard(m) {
  const jugado = isJugado(m);
  const centro = jugado
    ? (m.CODACTA
        ? `<a class="match-score" href="https://www.fcf.cat/ca/competicio/acta/${encodeURIComponent(m.CODACTA)}" target="_blank" rel="noopener">${m.GOLES_CASA} - ${m.GOLES_FUERA}</a>`
        : `<span class="match-score">${m.GOLES_CASA} - ${m.GOLES_FUERA}</span>`)
    : `<span class="badge-pending">Programado</span>`;

  const equipoUrl = (codigoClub, codEquipo) =>
    (codigoClub && codEquipo)
      ? `https://www.fcf.cat/ca/clubs/${encodeURIComponent(codigoClub)}/categories/${encodeURIComponent(codEquipo)}`
      : null;
  const casaUrl = equipoUrl(m.CODCLUB_CASA, m.CODEQUIPO_CASA);
  const fueraUrl = equipoUrl(m.CODCLUB_FUERA, m.CODEQUIPO_FUERA);
  const crest = (src, url) => {
    const img = `<img src="${crestUrl(src)}" alt="" loading="lazy">`;
    return url ? `<a href="${url}" target="_blank" rel="noopener">${img}</a>` : img;
  };
  const mapsUrl = (m.LATITUD && m.LONGITUD)
    ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.LATITUD + ',' + m.LONGITUD)}`
    : (m.CAMPO ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.CAMPO)}` : null);

  const card = document.createElement('article');
  card.className = 'match-card';
  card.innerHTML = `
    <div class="match-teams">
      <div class="team">
        ${crest(m.ESCUDO_CASA, casaUrl)}
        <span class="team-name">${m.NOMBRE_CASA ?? ''}</span>
      </div>
      <div class="center-info">
        <span class="match-hora">${formatHora(m.COMIENZO1)}</span>
        ${centro}
      </div>
      <div class="team">
        ${crest(m.ESCUDO_FUERA, fueraUrl)}
        <span class="team-name">${m.NOMBRE_FUERA ?? ''}</span>
      </div>
    </div>
    <div class="match-meta">
      <span>📍 ${mapsUrl ? `<a href="${mapsUrl}" target="_blank" rel="noopener">${m.CAMPO}</a>` : 'Campo por confirmar'}</span>
      <span>🏷️ ${m.NOMBRE_COMPETICION ?? ''}</span>
      <span class="badge-jornada">Jornada ${m.JORNADA}</span>
    </div>
  `;
  return card;
}

function matchesFiltrados() {
  const filtroEquipo = equipoSelect.value;
  return (DATA.matches || []).filter(m => !filtroEquipo || (m.trackedTeams || []).includes(filtroEquipo));
}

// Recalcula la lista de fines de semana disponibles a partir de los
// partidos ya filtrados por equipo, intentando mantener la posición sobre
// el mismo fin de semana si sigue existiendo tras cambiar el filtro.
function recalcWeekends() {
  const keyActual = weekends[currentIndex];
  const claves = new Set();
  for (const m of matchesFiltrados()) {
    const d = parseComienzo(m.COMIENZO1);
    if (d) claves.add(weekendKey(d));
  }
  weekends = [...claves].sort();
  if (weekends.length === 0) {
    currentIndex = 0;
    return;
  }
  const idx = weekends.indexOf(keyActual);
  currentIndex = idx >= 0 ? idx : weekends.length - 1;
}

function render() {
  recalcWeekends();
  resultsEl.innerHTML = '';

  if (weekends.length === 0) {
    pagerLabel.textContent = '';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    resultsEl.innerHTML = '<p>No hay partidos para ese filtro.</p>';
    return;
  }

  prevBtn.disabled = currentIndex <= 0;
  nextBtn.disabled = currentIndex >= weekends.length - 1;

  const claveSemana = weekends[currentIndex];
  const matches = matchesFiltrados()
    .filter(m => {
      const d = parseComienzo(m.COMIENZO1);
      return d && weekendKey(d) === claveSemana;
    })
    .sort((a, b) => (a.COMIENZO1 || '').localeCompare(b.COMIENZO1 || ''));

  const monday = new Date(claveSemana + 'T00:00:00');
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  pagerLabel.textContent = `${monday.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' })} – ${sunday.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' })}`;

  const groups = new Map();
  for (const m of matches) {
    const d = parseComienzo(m.COMIENZO1);
    const key = d ? d.toISOString().slice(0, 10) : '';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }

  for (const [, groupMatches] of groups) {
    const wrap = document.createElement('div');
    wrap.className = 'date-group';
    const heading = document.createElement('h2');
    heading.className = 'date-heading';
    heading.textContent = formatFecha(parseComienzo(groupMatches[0].COMIENZO1));
    wrap.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'matches-list';
    for (const m of groupMatches) list.appendChild(buildMatchCard(m));
    wrap.appendChild(list);

    resultsEl.appendChild(wrap);
  }
}

prevBtn.addEventListener('click', () => {
  if (currentIndex > 0) { currentIndex--; render(); }
});
nextBtn.addEventListener('click', () => {
  if (currentIndex < weekends.length - 1) { currentIndex++; render(); }
});
equipoSelect.addEventListener('change', render);

fetch(DATA_URL)
  .then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    return res.json();
  })
  .then(data => {
    DATA = data;
    const equipos = [...(data.equipos || [])].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    for (const eq of equipos) {
      const opt = document.createElement('option');
      opt.value = eq.codigo;
      opt.textContent = eq.nombre;
      equipoSelect.appendChild(opt);
    }

    // Posiciona por defecto en el fin de semana más próximo a hoy (el
    // anterior o en curso, para no empezar siempre al final del todo).
    recalcWeekends();
    const hoyKey = weekendKey(new Date());
    const idxHoy = weekends.findIndex(k => k >= hoyKey);
    currentIndex = idxHoy >= 0 ? idxHoy : Math.max(0, weekends.length - 1);

    statusEl.textContent = `${(data.matches || []).length} partido(s) de ${(data.equipos || []).length} equipo(s). Actualizado: ${formatActualizado(data.updatedAt)}`;

    render();
  })
  .catch(err => {
    setError(`No se pudo cargar ${DATA_URL}: ${err.message}`);
    console.error(err);
  });
</script>
</body>
</html>
