<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amistosos equipo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  #status { color: #666; margin-bottom: 1rem; white-space: pre-wrap; }
  #status.error { color: #b00020; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
</style>
</head>
<body>
<h1>PoC: partidos amistosos (equipo 54319830)</h1>
<div id="status">Cargando datos…</div>
<table id="matches" hidden>
  <thead>
    <tr><th>Fecha</th><th>Hora</th><th>Partido</th><th>Campo</th><th>Resultado</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
// Los datos se descargan y filtran periódicamente por un GitHub Action
// (ver .github/workflows/update-data.yml) porque la API de fcf.cat no
// envía cabeceras CORS y bloquea el fetch directo desde GitHub Pages.
const DATA_URL = 'data/amistosos.json';
const TEAM_CODE = '54319830';

const statusEl = document.getElementById('status');
const tableEl = document.getElementById('matches');
const tbodyEl = tableEl.querySelector('tbody');

function setError(message) {
  statusEl.textContent = message;
  statusEl.classList.add('error');
}

fetch(DATA_URL)
  .then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    return res.json();
  })
  .then(data => {
    const matches = data.matches || [];

    if (matches.length === 0) {
      statusEl.textContent = `Sin partidos programados para el equipo ${TEAM_CODE} en este rango de fechas.`;
      return;
    }

    statusEl.textContent = `${matches.length} partido(s) para el equipo ${TEAM_CODE}. Actualizado: ${data.updatedAt ?? '?'}`;

    for (const m of matches) {
      const jugado = !!m.CODACTA;
      const resultado = jugado
        ? `${m.PARTIDO_GOLES_CASA} - ${m.PARTIDO_GOLES_VISITANTE}`
        : 'Programado';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${m.FECHA_FORMATTED ?? ''}</td>
        <td>${m.HORA_COMIENZO ?? ''}</td>
        <td>${m.NOMEQUIPO_CASA ?? ''} vs ${m.NOMEQUIPO_FUERA ?? ''}</td>
        <td>${m.campo ?? ''}</td>
        <td>${resultado}</td>
      `;
      tbodyEl.appendChild(tr);
    }
    tableEl.hidden = false;
  })
  .catch(err => {
    setError(`No se pudo cargar ${DATA_URL}: ${err.message}`);
    console.error(err);
  });
</script>
</body>
</html>
