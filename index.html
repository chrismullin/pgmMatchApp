<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amistosos equipo</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card-bg: #ffffff;
    --navy: #10203f;
    --navy-soft: #47547a;
    --red: #c81e2c;
    --border: #e4e7ec;
    --pending-bg: #fef6e7;
    --pending-text: #a15c00;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--navy);
    margin: 0;
    padding: 0 1rem 3rem;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    padding: 2rem 0 1.5rem;
  }

  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.01em;
    margin: 0 0 0.25rem;
    color: var(--navy);
  }

  .subtitle {
    color: var(--navy-soft);
    margin: 0 0 1.25rem;
    font-size: 0.95rem;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--navy);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .links a:hover {
    border-color: var(--red);
    color: var(--red);
  }

  #status {
    color: var(--navy-soft);
    font-size: 0.85rem;
    margin: 0 0 1rem;
    white-space: pre-wrap;
  }

  #status.error {
    color: var(--red);
    font-weight: 600;
  }

  #matches {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .match-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    padding: 1.1rem 1.2rem 0.9rem;
  }

  .match-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.75rem;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    text-align: center;
    min-width: 0;
  }

  .team img {
    width: 48px;
    height: 48px;
    object-fit: contain;
  }

  .team-name {
    font-weight: 700;
    font-size: 0.85rem;
    line-height: 1.15;
  }

  .center-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    min-width: 92px;
  }

  .match-date {
    font-size: 0.75rem;
    color: var(--navy-soft);
    font-weight: 600;
  }

  .match-score {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--red);
  }

  a.match-score {
    text-decoration: none;
  }

  a.match-score:hover {
    text-decoration: underline;
  }

  .badge-pending {
    display: inline-block;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    background: var(--pending-bg);
    color: var(--pending-text);
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .match-meta {
    margin-top: 0.9rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.2rem;
    font-size: 0.78rem;
    color: var(--navy-soft);
  }

  .match-meta span {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .match-meta a {
    color: var(--navy-soft);
    text-decoration: underline;
    text-decoration-color: var(--border);
  }

  .match-meta a:hover {
    color: var(--red);
    text-decoration-color: var(--red);
  }

  .team a {
    line-height: 0;
  }

  .youtube-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    margin-left: auto;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    background: #ff0000;
    color: #fff !important;
    text-decoration: none !important;
    font-weight: 700;
    font-size: 0.75rem;
  }

  .youtube-link:hover {
    background: #cc0000;
  }

  footer {
    margin-top: 1.5rem;
    color: var(--navy-soft);
    font-size: 0.78rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Partidos amistosos Martinenc S16A</h1>
    <p class="subtitle">Calendario y resultados de los amistosos, actualizados automáticamente desde la FCF.</p>
    <nav class="links">
      <a href="https://www.fcf.cat/ca/clubs/1032/categories/54304670" target="_blank" rel="noopener">🏟️ Ficha del equipo (FCF)</a>
      <a href="https://www.fcf.cat/ca/competicio?temporadaId=22&disciplinaId=19308233&competicioId=58268428&grupId=58268544" target="_blank" rel="noopener">📅 Calendario de liga (FCF)</a>
      <a href="rivales.html">📊 Resultados y estadísticas de los rivales</a>
    </nav>
  </header>

  <div id="status">Cargando datos…</div>

  <div id="matches"></div>

  <footer>Datos: Federació Catalana de Futbol (fcf.cat)</footer>
</div>

<script>
// Los datos se descargan y filtran periódicamente por un GitHub Action
// (ver .github/workflows/update-data.yml) porque la API de fcf.cat no
// envía cabeceras CORS y bloquea el fetch directo desde GitHub Pages.
const DATA_URL = 'data/amistosos.json';
const YOUTUBE_LINKS_URL = 'data/youtube-links.json';
const TEAM_CODE = '54304670';
const CREST_BASE = 'https://files.fcf.cat/escudos/clubes/escudos/';

const statusEl = document.getElementById('status');
const matchesEl = document.getElementById('matches');

function setError(message) {
  statusEl.textContent = message;
  statusEl.classList.add('error');
}

function crestUrl(filename) {
  return filename ? CREST_BASE + encodeURIComponent(filename) : '';
}

function formatHora(hora) {
  return hora ? hora.slice(0, 5) : '';
}

// CODACTA no es fiable como señal de "partido disputado": hay partidos con
// CODACTA ya asignado que aún no se han jugado, y partidos ya jugados sin
// CODACTA todavía informado por la FCF. En su lugar, se compara la hora de
// inicio teórica del partido con la hora en que el Action recogió los datos
// (data.updatedAt): si han pasado más de 3h desde el inicio, se asume
// finalizado. Todo el rango de fechas de esta temporada cae en horario de
// verano (CEST, UTC+2), de ahí el offset fijo '+02:00'.
function isJugado(m, updatedAt) {
  if (!m.FECHA || !m.HORA_COMIENZO || !updatedAt) return !!m.CODACTA;
  const kickoff = new Date(`${m.FECHA.slice(0, 10)}T${m.HORA_COMIENZO}+02:00`);
  const referencia = new Date(updatedAt);
  if (isNaN(kickoff) || isNaN(referencia)) return !!m.CODACTA;
  return referencia.getTime() >= kickoff.getTime() + 3 * 60 * 60 * 1000;
}

Promise.all([
  fetch(DATA_URL).then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    return res.json();
  }),
  fetch(YOUTUBE_LINKS_URL)
    .then(res => res.ok ? res.json() : {})
    .catch(() => ({})),
])
  .then(([data, youtubeLinks]) => {
    const matches = data.matches || [];

    if (matches.length === 0) {
      statusEl.textContent = `Sin partidos programados en este rango de fechas.`;
      return;
    }

    statusEl.textContent = `${matches.length} partido(s). Actualizado: ${data.updatedAt ?? '?'}`;

    for (const m of matches) {
      const jugado = isJugado(m, data.updatedAt);
      const centro = jugado
        ? (m.CODACTA
            ? `<a class="match-score" href="https://www.fcf.cat/ca/competicio/acta/${encodeURIComponent(m.CODACTA)}" target="_blank" rel="noopener">${m.PARTIDO_GOLES_CASA} - ${m.PARTIDO_GOLES_VISITANTE}</a>`
            : `<span class="match-score">${m.PARTIDO_GOLES_CASA} - ${m.PARTIDO_GOLES_VISITANTE}</span>`)
        : `<span class="badge-pending">Programado</span>`;

      const equipoUrl = (codigoClub, codEquipo) =>
        (codigoClub && codEquipo)
          ? `https://www.fcf.cat/ca/clubs/${encodeURIComponent(codigoClub)}/categories/${encodeURIComponent(codEquipo)}`
          : null;
      const casaUrl = equipoUrl(m.CODIGO_CLUB, m.CODEQUIPO_CASA);
      const fueraUrl = equipoUrl(m.CODIGO_CLUB_FUERA, m.CODEQUIPO_FUERA);
      const crest = (src, url) => {
        const img = `<img src="${crestUrl(src)}" alt="" loading="lazy">`;
        return url ? `<a href="${url}" target="_blank" rel="noopener">${img}</a>` : img;
      };
      const mapsUrl = m.campo
        ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.campo)}`
        : null;
      const youtubeUrl = m.CODACTA ? youtubeLinks[m.CODACTA] : null;

      const card = document.createElement('article');
      card.className = 'match-card';
      card.innerHTML = `
        <div class="match-teams">
          <div class="team">
            ${crest(m.ESCUDO_CASA, casaUrl)}
            <span class="team-name">${m.NOMEQUIPO_CASA ?? ''}</span>
          </div>
          <div class="center-info">
            <span class="match-date">${m.FECHA_FORMATTED ?? ''} · ${formatHora(m.HORA_COMIENZO)}</span>
            ${centro}
          </div>
          <div class="team">
            ${crest(m.ESCUDO_FUERA, fueraUrl)}
            <span class="team-name">${m.NOMEQUIPO_FUERA ?? ''}</span>
          </div>
        </div>
        <div class="match-meta">
          <span>📍 ${mapsUrl ? `<a href="${mapsUrl}" target="_blank" rel="noopener">${m.campo}</a>` : 'Campo por confirmar'}</span>
          <span>🏷️ ${m.categoria ?? ''}</span>
          ${youtubeUrl ? `<a class="youtube-link" href="${youtubeUrl}" target="_blank" rel="noopener">▶️ Ver partido</a>` : ''}
        </div>
      `;
      matchesEl.appendChild(card);
    }
  })
  .catch(err => {
    setError(`No se pudo cargar ${DATA_URL}: ${err.message}`);
    console.error(err);
  });
</script>
</body>
</html>
