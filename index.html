<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amistosos equipo</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-index">
<div class="page">
  <header>
    <h1>Partidos amistosos Martinenc S16A</h1>
    <p class="subtitle">Calendario y resultados de los amistosos, actualizados automáticamente desde la FCF.</p>
    <nav class="links">
      <a href="rivales.html">📊 Resultados y estadísticas de los rivales</a>
      <a href="todo_martinenc.html">🏆 Liga de los equipos del Martinenc</a>
    </nav>
  </header>

  <div id="status">Cargando datos…</div>

  <div id="matches"></div>

  <footer>Datos: Federació Catalana de Futbol (fcf.cat)</footer>
</div>

<script>
// Los datos se descargan y filtran periódicamente por un GitHub Action
// (ver .github/workflows/update-data.yml) porque la API de fcf.cat no
// envía cabeceras CORS y bloquea el fetch directo desde GitHub Pages.
const DATA_URL = 'data/amistosos.json';
const DEFAULT_DATA_URL = 'data/default.json';
const EQUIPOS_URL = 'data/equipos.json';
const TEAM_CODE = '54304670';
const CREST_BASE = 'https://files.fcf.cat/escudos/clubes/escudos/';

const statusEl = document.getElementById('status');
const matchesEl = document.getElementById('matches');

function setError(message) {
  statusEl.textContent = message;
  statusEl.classList.add('error');
}

function crestUrl(filename) {
  return filename ? CREST_BASE + encodeURIComponent(filename) : '';
}

// Algunos escudos que devuelve la API de amistosos están rotos (404 en
// files.fcf.cat) para ciertos equipos. data/equipos.json permite informar un
// "escudo" de recambio por código de equipo, que tiene prioridad sobre el
// que venga en el partido.
let escudoOverrides = {};

function resolveEscudo(codigoEquipo, escudoApi) {
  return escudoOverrides[codigoEquipo] || escudoApi;
}

function formatHora(hora) {
  return hora ? hora.slice(0, 5) : '';
}

// data/default.json permite informar a mano partidos que la API de amistosos
// no recoge (o recoge con datos incompletos). Sus entradas tienen el mismo
// formato de fila que las de la API, y tienen prioridad sobre las
// equivalentes descargadas automáticamente (misma fecha/hora/equipos).
function mergeMatches(base, extra) {
  const key = m => `${m.FECHA}|${m.HORA_COMIENZO}|${m.CODEQUIPO_CASA}|${m.CODEQUIPO_FUERA}`;
  const map = new Map(base.map(m => [key(m), m]));
  for (const m of extra) map.set(key(m), m);
  return [...map.values()].sort((a, b) =>
    `${a.FECHA}T${a.HORA_COMIENZO || ''}`.localeCompare(`${b.FECHA}T${b.HORA_COMIENZO || ''}`)
  );
}

// Muestra la fecha/hora de actualización del Action en la zona horaria de
// Madrid, con el formato "dd/mm/aaaa a las hh:mm", independientemente de la
// zona horaria del navegador de quien visite la página.
function formatActualizado(iso) {
  if (!iso) return '?';
  const fecha = new Date(iso);
  if (isNaN(fecha)) return iso;
  const partes = new Intl.DateTimeFormat('es-ES', {
    timeZone: 'Europe/Madrid',
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(fecha);
  const valor = tipo => partes.find(p => p.type === tipo)?.value;
  return `${valor('day')}/${valor('month')}/${valor('year')} a las ${valor('hour')}:${valor('minute')}`;
}

// CODACTA no es fiable como señal de "partido disputado": hay partidos con
// CODACTA ya asignado que aún no se han jugado, y partidos ya jugados sin
// CODACTA todavía informado por la FCF. En su lugar, se compara la hora de
// inicio teórica del partido con la hora en que el Action recogió los datos
// (data.updatedAt): si han pasado más de 3h desde el inicio, se asume
// finalizado. Todo el rango de fechas de esta temporada cae en horario de
// verano (CEST, UTC+2), de ahí el offset fijo '+02:00'.
// Además, si ya hay un resultado distinto de 0-0 informado, se considera
// jugado de inmediato aunque no hayan pasado las 3h ni haya CODACTA, ya que
// un marcador no nulo solo se rellena una vez el partido está en curso o
// finalizado.
function isJugado(m, updatedAt) {
  const golesCasa = Number(m.PARTIDO_GOLES_CASA);
  const golesFuera = Number(m.PARTIDO_GOLES_VISITANTE);
  if (!Number.isNaN(golesCasa) && !Number.isNaN(golesFuera) && (golesCasa !== 0 || golesFuera !== 0)) return true;
  if (!m.FECHA || !m.HORA_COMIENZO || !updatedAt) return !!m.CODACTA;
  const kickoff = new Date(`${m.FECHA.slice(0, 10)}T${m.HORA_COMIENZO}+02:00`);
  const referencia = new Date(updatedAt);
  if (isNaN(kickoff) || isNaN(referencia)) return !!m.CODACTA;
  return referencia.getTime() >= kickoff.getTime() + 3 * 60 * 60 * 1000;
}

Promise.all([
  fetch(DATA_URL).then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    return res.json();
  }),
  fetch(DEFAULT_DATA_URL)
    .then(res => res.ok ? res.json() : { matches: [] })
    .catch(() => ({ matches: [] })),
  fetch(EQUIPOS_URL)
    .then(res => res.ok ? res.json() : { equipos: [] })
    .catch(() => ({ equipos: [] })),
])
  .then(([data, defaultData, equiposData]) => {
    const matches = mergeMatches(data.matches || [], defaultData.matches || []);

    escudoOverrides = Object.fromEntries(
      (equiposData.equipos || []).filter(eq => eq.escudo).map(eq => [eq.codigo, eq.escudo])
    );

    if (matches.length === 0) {
      statusEl.textContent = `Sin partidos programados en este rango de fechas.`;
      return;
    }

    statusEl.textContent = `${matches.length} partido(s). Actualizado: ${formatActualizado(data.updatedAt)}`;

    for (const m of matches) {
      const jugado = isJugado(m, data.updatedAt);
      const centro = jugado
        ? (m.CODACTA
            ? `<a class="match-score" href="https://www.fcf.cat/ca/competicio/acta/${encodeURIComponent(m.CODACTA)}" target="_blank" rel="noopener">${m.PARTIDO_GOLES_CASA} - ${m.PARTIDO_GOLES_VISITANTE}</a>`
            : `<span class="match-score">${m.PARTIDO_GOLES_CASA} - ${m.PARTIDO_GOLES_VISITANTE}</span>`)
        : `<span class="badge-pending">Programado</span>`;

      const equipoUrl = (codigoClub, codEquipo) =>
        (codigoClub && codEquipo)
          ? `https://www.fcf.cat/ca/clubs/${encodeURIComponent(codigoClub)}/categories/${encodeURIComponent(codEquipo)}`
          : null;
      const casaUrl = equipoUrl(m.CODIGO_CLUB, m.CODEQUIPO_CASA);
      const fueraUrl = equipoUrl(m.CODIGO_CLUB_FUERA, m.CODEQUIPO_FUERA);
      const crest = (src, url) => {
        const img = `<img src="${crestUrl(src)}" alt="" loading="lazy">`;
        return url ? `<a href="${url}" target="_blank" rel="noopener">${img}</a>` : img;
      };
      const mapsUrl = m.campo
        ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.campo)}`
        : null;
      const card = document.createElement('article');
      card.className = 'match-card';
      card.innerHTML = `
        <div class="match-teams">
          <div class="team">
            ${crest(resolveEscudo(m.CODEQUIPO_CASA, m.ESCUDO_CASA), casaUrl)}
            <span class="team-name">${m.NOMEQUIPO_CASA ?? ''}</span>
          </div>
          <div class="center-info">
            <span class="match-date">${m.FECHA_FORMATTED ?? ''} · ${formatHora(m.HORA_COMIENZO)}</span>
            ${centro}
          </div>
          <div class="team">
            ${crest(resolveEscudo(m.CODEQUIPO_FUERA, m.ESCUDO_FUERA), fueraUrl)}
            <span class="team-name">${m.NOMEQUIPO_FUERA ?? ''}</span>
          </div>
        </div>
        <div class="match-meta">
          <span>📍 ${mapsUrl ? `<a href="${mapsUrl}" target="_blank" rel="noopener">${m.campo}</a>` : 'Campo por confirmar'}</span>
          <span>🏷️ ${m.categoria ?? ''}</span>
        </div>
      `;
      matchesEl.appendChild(card);
    }
  })
  .catch(err => {
    setError(`No se pudo cargar ${DATA_URL}: ${err.message}`);
    console.error(err);
  });
</script>
</body>
</html>
