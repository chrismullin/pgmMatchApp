<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amistosos equipo</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #1a1f26;
    --muted: #667085;
    --border: #e4e7ec;
    --primary: #1e6f4c;
    --primary-dark: #145238;
    --accent: #0b5fff;
    --pending-bg: #fef6e7;
    --pending-text: #a15c00;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 1rem 3rem;
  }

  .page {
    max-width: 780px;
    margin: 0 auto;
  }

  header {
    padding: 2rem 0 1.5rem;
  }

  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.25rem;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 1.25rem;
    font-size: 0.95rem;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .links a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  #status {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 1rem;
    white-space: pre-wrap;
  }

  #status.error {
    color: #b00020;
    font-weight: 600;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  thead th {
    text-align: left;
    padding: 0.75rem 1rem;
    background: #fafbfc;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--border);
  }

  tbody td {
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  tbody tr:hover {
    background: #fafbfc;
  }

  .match-teams {
    font-weight: 500;
  }

  .match-category {
    display: block;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 0.15rem;
  }

  .result-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
  }

  .result-link:hover {
    color: var(--primary-dark);
    text-decoration: underline;
  }

  .badge-pending {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    background: var(--pending-bg);
    color: var(--pending-text);
    font-size: 0.75rem;
    font-weight: 600;
  }

  footer {
    margin-top: 1.5rem;
    color: var(--muted);
    font-size: 0.78rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Partidos amistosos Martinenc S16A</h1>
    <p class="subtitle">Calendario y resultados de los amistosos, actualizados automáticamente desde la FCF.</p>
    <nav class="links">
      <a href="https://www.fcf.cat/ca/clubs/1032/categories/54304670" target="_blank" rel="noopener">🏟️ Ficha del equipo (FCF)</a>
      <a href="https://www.fcf.cat/ca/competicio?temporadaId=22&disciplinaId=19308233&competicioId=58268428&grupId=58268544" target="_blank" rel="noopener">📅 Calendario de liga (FCF)</a>
    </nav>
  </header>

  <div id="status">Cargando datos…</div>

  <div class="card">
    <table id="matches" hidden>
      <thead>
        <tr><th>Fecha</th><th>Hora</th><th>Partido</th><th>Campo</th><th>Resultado</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>Datos: Federació Catalana de Futbol (fcf.cat)</footer>
</div>

<script>
// Los datos se descargan y filtran periódicamente por un GitHub Action
// (ver .github/workflows/update-data.yml) porque la API de fcf.cat no
// envía cabeceras CORS y bloquea el fetch directo desde GitHub Pages.
const DATA_URL = 'data/amistosos.json';
const TEAM_CODE = '54304670';

const statusEl = document.getElementById('status');
const tableEl = document.getElementById('matches');
const tbodyEl = tableEl.querySelector('tbody');

function setError(message) {
  statusEl.textContent = message;
  statusEl.classList.add('error');
}

fetch(DATA_URL)
  .then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    return res.json();
  })
  .then(data => {
    const matches = data.matches || [];

    if (matches.length === 0) {
      statusEl.textContent = `Sin partidos programados en este rango de fechas.`;
      return;
    }

    statusEl.textContent = `${matches.length} partido(s). Actualizado: ${data.updatedAt ?? '?'}`;

    for (const m of matches) {
      const jugado = !!m.CODACTA;
      const resultado = jugado
        ? `<a class="result-link" href="https://www.fcf.cat/ca/competicio/acta/${encodeURIComponent(m.CODACTA)}" target="_blank" rel="noopener">${m.PARTIDO_GOLES_CASA} - ${m.PARTIDO_GOLES_VISITANTE}</a>`
        : `<span class="badge-pending">Programado</span>`;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${m.FECHA_FORMATTED ?? ''}</td>
        <td>${m.HORA_COMIENZO ?? ''}</td>
        <td>
          <span class="match-teams">${m.NOMEQUIPO_CASA ?? ''} vs ${m.NOMEQUIPO_FUERA ?? ''}</span>
          <span class="match-category">${m.categoria ?? ''}</span>
        </td>
        <td>${m.campo ?? ''}</td>
        <td>${resultado}</td>
      `;
      tbodyEl.appendChild(tr);
    }
    tableEl.hidden = false;
  })
  .catch(err => {
    setError(`No se pudo cargar ${DATA_URL}: ${err.message}`);
    console.error(err);
  });
</script>
</body>
</html>
